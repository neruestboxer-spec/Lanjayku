<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FBF3E0">
  <meta name="robots" content="noindex, nofollow">
  <title>Lanjayku — Cafe OS</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='2' y='2' width='28' height='28' rx='5' fill='%23C62828' stroke='%231F2A44' stroke-width='3'/%3E%3Cpath d='M9 12h11v6a4 4 0 0 1-4 4h-3a4 4 0 0 1-4-4zM20 13h1.5a2.5 2.5 0 0 1 0 5H20' fill='none' stroke='white' stroke-width='2.2'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="topload" class="topload"></div>
  <div id="toasts" class="toasts" aria-live="polite"></div>

  <!-- Layar muat awal -->
  <div id="boot" class="boot">
    <div class="center">
      <div class="brand-logo"><svg class="ic ic-lg" viewBox="0 0 24 24"><path d="M17 8h1a4 4 0 1 1 0 8h-1M3 8h14v9a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4zM6 2v2M10 2v2M14 2v2"/></svg></div>
      MEMUAT LANJAYKU OS…
    </div>
  </div>

  <!-- ============ LOGIN ============ -->
  <main id="login-view" class="login-view hidden">
    <div class="login-box">
      <div class="login-brand">
        <div class="brand-logo"><svg class="ic ic-lg" viewBox="0 0 24 24"><path d="M17 8h1a4 4 0 1 1 0 8h-1M3 8h14v9a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4zM6 2v2M10 2v2M14 2v2"/></svg></div>
        <div><h1>LANJAYKU</h1><div class="brand-sub" style="display:block">CAFE OS · ZONA WAKTU WITA</div></div>
      </div>
      <section class="win">
        <div class="win-bar"><div class="win-title"><span class="sq"></span>Masuk ke Sistem</div>
          <div class="win-ctrls" aria-hidden="true"><span class="win-ctrl">_</span><span class="win-ctrl">□</span></div></div>
        <div class="win-body">
          <div id="login-absen-note" class="note green hidden" style="margin-bottom:14px">
            <svg class="ic" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><path d="M14 14h3v3h-3zM20 14v.01M14 20h.01M17 20h4v-3"/></svg>
            <div><b>QR absensi terdeteksi.</b> Login untuk mencatat absen Anda.</div>
          </div>
          <div id="config-warning" class="note red hidden" style="margin-bottom:14px"></div>
          <form id="login-form" class="stack" style="gap:14px" autocomplete="on">
            <div class="field"><label for="lg-user">Username</label>
              <input id="lg-user" class="input" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required></div>
            <div class="field"><label for="lg-pass">Password</label>
              <div class="input-group"><input id="lg-pass" class="input" type="password" name="password" autocomplete="current-password" required>
                <button type="button" class="btn btn-ghost btn-sm" id="lg-show" style="margin:3px" aria-label="Tampilkan password">Lihat</button></div></div>
            <button class="btn btn-primary btn-lg btn-block" type="submit" id="lg-btn">Masuk</button>
          </form>
        </div>
        <div class="win-foot"><span class="dot live"></span> Sesi berakhir otomatis setelah 6 jam tidak aktif</div>
      </section>
      <p class="login-foot">Lupa password? Hubungi admin cafe untuk reset.</p>
    </div>
  </main>

  <!-- ============ APLIKASI ============ -->
  <div id="app-view" class="app hidden">
    <header class="topbar">
      <div class="brand">
        <div class="brand-logo"><svg class="ic" viewBox="0 0 24 24"><path d="M17 8h1a4 4 0 1 1 0 8h-1M3 8h14v9a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4zM6 2v2M10 2v2M14 2v2"/></svg></div>
        <div><div class="brand-name">LANJAYKU</div><div class="brand-sub">OS v1.0 · WITA</div></div>
      </div>
      <button class="btn btn-icon menu-btn" id="menu-btn" aria-label="Buka menu"><svg class="ic" viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>
      <div class="top-mid">
        <div class="clock" id="clock"><svg class="ic ic-sm" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span class="full" id="clock-date"></span><span class="full">·</span><span id="clock-time">--:--:--</span> WITA</div>
        <div class="status-live" id="net-status"><span class="dot live"></span>TERHUBUNG KE SERVER</div>
      </div>
      <div class="top-right">
        <button class="btn btn-icon btn-sm hide-sm" id="btn-print" title="Cetak halaman" aria-label="Cetak halaman"><svg class="ic" viewBox="0 0 24 24"><path d="M6 9V2h12v7M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg></button>
        <button class="user-chip" id="user-chip" title="Akun saya">
          <span class="uname"><b id="user-name">—</b><span class="role-badge" id="user-role">—</span></span>
          <span class="av" id="user-av">?</span>
        </button>
      </div>
    </header>

    <nav class="sidebar" id="sidebar" aria-label="Menu utama"></nav>
    <div class="backdrop" id="backdrop"></div>

    <main class="main" id="page" tabindex="-1"></main>
    <nav class="bottom-nav" id="bottom-nav" aria-label="Menu cepat"></nav>
  </div>

  <script src="js/config.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/api.js"></script>
  <script src="js/pages-dashboard.js"></script>
  <script src="js/pages-kasir.js"></script>
  <script src="js/pages-inventori.js"></script>
  <script src="js/pages-laporan.js"></script>
  <script src="js/pages-absensi.js"></script>
  <script src="js/pages-gaji.js"></script>
  <script src="js/pages-admin.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
